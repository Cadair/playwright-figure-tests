[tox]
min_version = 4.0
envlist =
    py{311,312,313,314,315}

[testenv]
description = run tests
set_env =
    MPLBACKEND = Agg
    # Pin to a stable absolute path so pytester's HOME override (it sets HOME to
    # a per-test tmp dir) doesn't redirect Playwright's default $HOME/.cache
    # resolution and hide the browsers commands_pre just installed.
    PLAYWRIGHT_BROWSERS_PATH = {env:PLAYWRIGHT_BROWSERS_PATH:{tox_root}/.ms-playwright}
commands_pre =
    python -m playwright install chromium firefox
commands =
    pytest {posargs}
