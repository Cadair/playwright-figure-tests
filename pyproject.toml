[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm[simple]>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "playwright_figure_tests"
authors = [
    { name = "Stuart Mumford", email = "stuart@cadair.com" },
]
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
description = "pytest helper for visual regression testing of rendered web pages with Playwright, built on pytest-mpl"
requires-python = ">=3.11"
dependencies = [
    "pytest>=7",
    "pytest-mpl>=0.19",
    "pytest-playwright>=0.4",
]
dynamic = [
    "version",
]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.entry-points.pytest11]
playwright_figure_tests = "playwright_figure_tests._plugin"

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.ruff]
line-length = 100